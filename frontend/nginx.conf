server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tăng tốc tải tài nguyên tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache dài hạn cho các bundle có hash của Vite
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hỗ trợ reverse proxy nội bộ tới API Gateway qua Docker network (nếu dùng đường dẫn tương đối /api)
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Fallback SPA cho React Router (tránh lỗi 404 khi F5 tại /products/:id, /admin, /profile...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
