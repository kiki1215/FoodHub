server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service-profile
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: user-service-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/users/**
        - id: menu-service-categories
          uri: ${MENU_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/categories/**
        - id: menu-service-products
          uri: ${MENU_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: menu-service-admin-categories
          uri: ${MENU_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/categories/**
        - id: menu-service-admin-products
          uri: ${MENU_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/products/**

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.foodhub.gateway: INFO
