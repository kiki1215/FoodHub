server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ORDER_DB_NAME:order_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
    username: ${ORDER_DB_USER:order_svc}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  services:
    cart-url: ${CART_SERVICE_URL:http://localhost:8083}
    menu-url: ${MENU_SERVICE_URL:http://localhost:8082}

logging:
  level:
    com.foodhub.order: INFO
