server:
  port: ${MENU_SERVICE_PORT:8082}

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MENU_DB_NAME:menu_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MENU_DB_USER:menu_svc}
    password: ${MENU_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: ${MENU_UPLOAD_DIR:/app/uploads/menu}
    max-size-bytes: 5242880

logging:
  level:
    com.foodhub.menu: INFO
