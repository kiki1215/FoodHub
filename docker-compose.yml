# ==============================================================================
# FOODHUB - DOCKER COMPOSE (GIAI ĐOẠN 1: KHỞI TẠO HẠ TẦNG MYSQL)
# ==============================================================================
# Các Microservices (api-gateway, user-service, menu-service, cart-service,
# order-service, ai-service, frontend) sẽ được bổ sung dần ở các giai đoạn sau.
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: foodhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - foodhub-network

volumes:
  mysql_data:
    name: foodhub-mysql-data

networks:
  foodhub-network:
    name: foodhub-network
    driver: bridge
