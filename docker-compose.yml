# ==============================================================================
# FOODHUB - DOCKER COMPOSE
# Giai đoạn 3: MySQL + User Service + Menu Service + API Gateway
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: foodhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - foodhub-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: foodhub-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-8081}
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-mysql}
      MYSQL_PORT: 3306
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      USER_DB_USER: ${USER_DB_USER:-user_svc}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Quản trị viên FOODHUB}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    networks:
      - foodhub-network

  menu-service:
    build:
      context: ./backend/menu-service
      dockerfile: Dockerfile
    container_name: foodhub-menu-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MENU_SERVICE_PORT: ${MENU_SERVICE_PORT:-8082}
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-mysql}
      MYSQL_PORT: 3306
      MENU_DB_NAME: ${MENU_DB_NAME:-menu_db}
      MENU_DB_USER: ${MENU_DB_USER:-menu_svc}
      MENU_DB_PASSWORD: ${MENU_DB_PASSWORD}
      MENU_UPLOAD_DIR: /app/uploads/menu
    ports:
      - "${MENU_SERVICE_PORT:-8082}:8082"
    volumes:
      - menu_uploads:/app/uploads/menu
    networks:
      - foodhub-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: foodhub-api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - menu-service
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080}
      USER_SERVICE_URL: http://user-service:8081
      MENU_SERVICE_URL: http://menu-service:8082
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - foodhub-network

volumes:
  mysql_data:
    name: foodhub-mysql-data
  menu_uploads:
    name: foodhub-menu-uploads

networks:
  foodhub-network:
    name: foodhub-network
    driver: bridge
